trigger:
- main
- azure-pipelines

pool:
  name: "Standard-Linux"
resources:
  repositories:
    - repository: templates
      type: git
      name: MPT/ops-build-templates-aks-releases
      ref: releases/v15

variables:
  - name: appName
    value: swo-extension-aws

stages:
  - stage: prepare
    displayName: "Prerequisites"
    jobs:
      - template: aks-docker-templates/build_prerequisites.yaml@templates
      - template: aks-docker-templates/build_artifacts.yaml@templates
        parameters:
          application: $(appName)

  - stage: build
    displayName: "Build"
    dependsOn: prepare
    variables:
      - template: aks-docker-templates/acr-creds-group.yaml@templates
    jobs:
      - job: build_image
        displayName: Build image
        variables:
          - name: buildVersion
            value: $[ stageDependencies.prepare.build_prerequisites.outputs['vars.BUILD_VERSION'] ]
          - name: majorVersion
            value: $[ split(variables.buildVersion, '.')[0] ]
        steps:
          - template: aks-docker-templates/docker-build-steps.yaml@templates
            parameters:
              repository: $(appName)
              sourceBuild: $(buildVersion)
              Dockerfile: Dockerfile
              dockerArgs: --target prod
              skipImagePush: ${{ eq(variables['Build.Reason'], 'PullRequest') }}

      - job: BuildHelmChart
        displayName: Build Helm Chart
        variables:
              - template: aks-docker-templates/acr-creds-group.yaml@templates
              - name: buildVersion
                value: $[ stageDependencies.prepare.build_prerequisites.outputs['vars.BUILD_VERSION'] ]
        steps:
              - template: aks-docker-templates/helm-build-steps.yaml@templates
                parameters:
                  buildNumber: $(buildVersion)
                  repository: $(appName)
                  workingDirectory: helm/$(appName)
                  skipImagePush: ${{ eq(variables['Build.Reason'], 'PullRequest') }}
  - stage: sbom
    displayName: SBOM
    dependsOn: [prepare, build]
    # Platform publish rule: publish only from main, release/* or a manually queued run.
    # PR builds never publish.
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), eq(variables['Build.Reason'], 'Manual')))
    variables:
      - group: marketplace.dtrack
      - name: buildVersion
        value: $[ stageDependencies.prepare.build_prerequisites.outputs['vars.BUILD_VERSION'] ]
      - name: majorVersion
        value: $[ split(variables.buildVersion, '.')[0] ]
    jobs:
      - template: aks-tests-templates/jobs/dtrack-python-sbom-job.yaml@templates
        parameters:
          pythonVersion: "3.x"
          projectName: $(appName)
          projectVersion: $(majorVersion)
          dtrackAPIKey: $(dtrackAPIKey)
          dtrackURI: $(dtrackURI)
  - stage: publish
    displayName: Publish
    dependsOn:
      - prepare
      - build
    jobs:
      - job: publish
        displayName: Publish
        # Same publish rule as the sbom stage: main, release/* or a manual run.
        condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), eq(variables['Build.Reason'], 'Manual')))
        variables:
          - template: aks-docker-templates/acr-creds-group.yaml@templates
          - name: buildVersion
            value: $[ stageDependencies.prepare.build_prerequisites.outputs['vars.BUILD_VERSION'] ]
        steps:
          - template: aks-docker-templates/publish-steps.yaml@templates
            parameters:
              repository: $(appName)
              buildNumber: $(buildVersion)
              # InfraPortal product the build is registered under.
              product: mpt-extensions
              components: []
